name: Build Kernel - RKSU + SuSFS (SM6225)

on:
  workflow_dispatch:
    inputs:
      DEFCONFIG:
        description: 'Defconfig a usar'
        required: true
        default: 'vendor/bengal-perf_defconfig'
        type: choice
        options:
          - vendor/bengal-perf_defconfig
          - vendor/bengal_defconfig
          - vendor/bengal-lite-perf_defconfig
          - vendor/bengal-lite_defconfig

      ENABLE_SUSFS:
        description: 'Ativar SuSFS?'
        required: true
        default: 'true'
        type: boolean

      SUSFS_BRANCH:
        description: 'Branch do susfs4ksu'
        required: true
        default: 'kernel-4.19'

      ENABLE_LTO:
        description: 'Ativar LTO (Link Time Optimization)?'
        required: true
        default: 'false'
        type: boolean

env:
  ARCH: arm64
  KERNEL_VERSION: "4.19"
  KERNEL_NAME: "KultriKernel"
  DEVICE: "SM6225-Motorola"

jobs:
  build:
    name: "Build ${{ github.event.inputs.DEFCONFIG }}"
    runs-on: ubuntu-latest

    steps:
      # ── Espaço em disco ──────────────────────────────────────────
      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h

      # ── Dependências ─────────────────────────────────────────────
      - name: Instalar dependências
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git bc bison flex libssl-dev libelf-dev python3 \
            make gcc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils zip curl wget cpio kmod zstd tar \
            lld llvm clang

      - name: Configurar git com token
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      # ── Checkout do kernel ────────────────────────────────────────
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          path: kernel_source
          fetch-depth: 1

      # ── Toolchain ─────────────────────────────────────────────────
      - name: Baixar Neutron Clang (via AntMan)
        run: |
          mkdir -p $HOME/clang
          cd $HOME/clang
          curl -fsSL "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman" -o antman
          chmod +x antman
          ./antman -S || {
            echo "⚠️ AntMan falhou, usando clang do sistema como fallback"
            echo "CLANG_PATH=/usr" >> $GITHUB_ENV
            exit 0
          }
          echo "CLANG_PATH=$HOME/clang" >> $GITHUB_ENV
          echo "✅ Clang instalado:"
          $HOME/clang/bin/clang --version | head -1

      - name: Configurar PATH da toolchain
        run: |
          CLANG_PATH="${{ env.CLANG_PATH }}"
          [ -z "$CLANG_PATH" ] && CLANG_PATH="$HOME/clang"
          echo "$CLANG_PATH/bin" >> $GITHUB_PATH

      # ── SuSFS ─────────────────────────────────────────────────────
      - name: Integrar SuSFS
        if: ${{ github.event.inputs.ENABLE_SUSFS == 'true' }}
        run: |
          # Repositório oficial do SuSFS está no GitLab
          git clone --depth=1 \
            -b ${{ github.event.inputs.SUSFS_BRANCH }} \
            https://gitlab.com/simonpunk/susfs4ksu.git

          cd kernel_source

          cp ../susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          cp ../susfs4ksu/kernel_patches/fs/sus_su.c fs/ 2>/dev/null || true

          PATCH=$(ls ../susfs4ksu/kernel_patches/ | grep "add_susfs_in_kernel-${{ env.KERNEL_VERSION }}" | head -1)
          if [ -n "$PATCH" ]; then
            patch -p1 --forward < ../susfs4ksu/kernel_patches/$PATCH && \
              echo "✅ Patch kernel aplicado" || echo "⚠️ Patch já aplicado (continuando)"
          else
            echo "❌ Patch não encontrado para kernel ${{ env.KERNEL_VERSION }}"
            ls ../susfs4ksu/kernel_patches/
            exit 1
          fi

          KSU_PATCH=$(ls ../susfs4ksu/kernel_patches/KernelSU/ | head -1)
          [ -n "$KSU_PATCH" ] && \
            patch -p1 --forward < ../susfs4ksu/kernel_patches/KernelSU/$KSU_PATCH && \
            echo "✅ Patch KSU aplicado" || echo "⚠️ Patch KSU já aplicado (continuando)"

      # ── Configurar ────────────────────────────────────────────────
      - name: Gerar .config
        working-directory: kernel_source
        run: |
          yes "" | make O=out ARCH=${{ env.ARCH }} ${{ github.event.inputs.DEFCONFIG }}

      - name: Ajustar configs KSU + SuSFS
        working-directory: kernel_source
        run: |
          ./scripts/config --file out/.config --enable CONFIG_KSU
          ./scripts/config --file out/.config --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE

          if [ "${{ github.event.inputs.ENABLE_SUSFS }}" == "true" ]; then
            ./scripts/config --file out/.config \
              --enable  CONFIG_KSU_SUSFS \
              --enable  CONFIG_KSU_SUSFS_SUS_PATH \
              --enable  CONFIG_KSU_SUSFS_SUS_MOUNT \
              --enable  CONFIG_KSU_SUSFS_SUS_KSTAT \
              --enable  CONFIG_KSU_SUSFS_TRY_UMOUNT \
              --enable  CONFIG_KSU_SUSFS_SPOOF_UNAME \
              --enable  CONFIG_KSU_SUSFS_ENABLE_LOG \
              --disable CONFIG_KSU_SUSFS_SUS_OVERLAYFS
          fi

          if [ "${{ github.event.inputs.ENABLE_LTO }}" == "true" ]; then
            ./scripts/config --file out/.config \
              --enable  CONFIG_LTO_CLANG \
              --disable CONFIG_LTO_NONE
          fi

          # olddefconfig: usa yes "" para responder automaticamente qualquer nova config com o valor padrão
          yes "" | make O=out ARCH=${{ env.ARCH }} olddefconfig

      # ── Compilar ──────────────────────────────────────────────────
      - name: Compilar kernel
        working-directory: kernel_source
        run: |
          BUILD_START=$(date +"%s")

          make -j$(nproc --all) O=out \
            ARCH=${{ env.ARCH }} \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            DTC_FLAGS="-f" \
            2>&1 | tee build.log

          BUILD_END=$(date +"%s")
          DIFF=$(( BUILD_END - BUILD_START ))
          echo "⏱️ Tempo: $(( DIFF / 60 ))m $(( DIFF % 60 ))s"

          if [ -f out/arch/arm64/boot/Image ]; then
            echo "✅ Image gerada!"
            ls -lh out/arch/arm64/boot/Image*
          else
            echo "❌ Build falhou"
            tail -80 build.log
            exit 1
          fi

      # ── AnyKernel3 ────────────────────────────────────────────────
      - name: Empacotar com AnyKernel3
        run: |
          git clone --depth=1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/osm0sis/AnyKernel3.git AnyKernel3

          # anykernel.sh está na raiz do repo → checkout coloca em kernel_source/
          cp kernel_source/anykernel.sh AnyKernel3/anykernel.sh

          for img in Image Image.gz Image-dtb Image.gz-dtb; do
            if [ -f kernel_source/out/arch/arm64/boot/$img ]; then
              cp kernel_source/out/arch/arm64/boot/$img AnyKernel3/
              echo "✅ Copiado: $img"
              break
            fi
          done

          [ -f kernel_source/out/arch/arm64/boot/dtbo.img ] && \
            cp kernel_source/out/arch/arm64/boot/dtbo.img AnyKernel3/

          SUSFS_TAG=""
          [ "${{ github.event.inputs.ENABLE_SUSFS }}" == "true" ] && SUSFS_TAG="-SuSFS"
          ZIP_NAME="${{ env.KERNEL_NAME }}-RKSU${SUSFS_TAG}-${{ env.DEVICE }}-$(date +%Y%m%d-%H%M).zip"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

          cd AnyKernel3
          zip -r9 ../$ZIP_NAME * -x .git README.md
          echo "📦 $ZIP_NAME ($(du -sh ../$ZIP_NAME | cut -f1))"

      # ── Upload ────────────────────────────────────────────────────
      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 7
          if-no-files-found: error

      - name: Upload log em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure
          path: kernel_source/build.log
          retention-days: 3

      # ── Sumário ───────────────────────────────────────────────────
      - name: Resumo do build
        if: success()
        run: |
          echo "## ✅ Build concluído!" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Kernel | ${{ env.KERNEL_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dispositivo | ${{ env.DEVICE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Defconfig | ${{ github.event.inputs.DEFCONFIG }} |" >> $GITHUB_STEP_SUMMARY
          echo "| RKSU | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| SuSFS | ${{ github.event.inputs.ENABLE_SUSFS }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Arquivo | \`${{ env.ZIP_NAME }}\` |" >> $GITHUB_STEP_SUMMARY

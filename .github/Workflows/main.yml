name: Build Kernel - RKSU + SuSFS (SM6225)

on:
  workflow_dispatch:
    inputs:
      DEFCONFIG:
        description: 'Defconfig a usar'
        required: true
        default: 'vendor/bengal-perf_defconfig'
        type: choice
        options:
          - vendor/bengal-perf_defconfig
          - vendor/bengal_defconfig
          - vendor/bengal-lite-perf_defconfig
          - vendor/bengal-lite_defconfig

      ENABLE_SUSFS:
        description: 'Ativar SuSFS?'
        required: true
        default: 'true'
        type: boolean

      SUSFS_BRANCH:
        description: 'Branch do susfs4ksu'
        required: true
        default: 'kernel-4.19'

      ENABLE_LTO:
        description: 'Ativar LTO (Link Time Optimization)?'
        required: true
        default: 'false'
        type: boolean

env:
  # ── Kernel ─────────────────────────────────────────────────────
  ARCH: arm64
  KERNEL_VERSION: "4.19"

  # ── Toolchain ──────────────────────────────────────────────────
  # Neutron Clang 18 (ótimo para kernel 4.19)
  CLANG_URL: "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/09032024/neutron-clang-09032024.tar.zst"

  # ── Nomes ──────────────────────────────────────────────────────
  KERNEL_NAME: "KultriKernel"
  DEVICE: "SM6225-Motorola"

jobs:
  build:
    name: "Build ${{ github.event.inputs.DEFCONFIG }}"
    runs-on: ubuntu-latest

    steps:
      # ── Espaço em disco ──────────────────────────────────────────
      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h

      # ── Dependências ─────────────────────────────────────────────
      - name: Instalar dependências
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git bc bison flex libssl-dev libelf-dev python3 \
            make gcc binutils zip curl wget cpio kmod \
            lld llvm clang zstd tar

      # ── Checkout do kernel ────────────────────────────────────────
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          path: kernel_source
          fetch-depth: 1

      # ── Toolchain ─────────────────────────────────────────────────
      - name: Baixar Neutron Clang
        run: |
          mkdir -p $HOME/clang
          echo "Baixando Neutron Clang..."
          wget -q --show-progress "${{ env.CLANG_URL }}" -O clang.tar.zst
          tar -I zstd -xf clang.tar.zst -C $HOME/clang
          rm clang.tar.zst
          echo "Clang version:"
          $HOME/clang/bin/clang --version | head -1

      # ── SuSFS ─────────────────────────────────────────────────────
      - name: Integrar SuSFS
        if: ${{ github.event.inputs.ENABLE_SUSFS == 'true' }}
        run: |
          echo "Clonando susfs4ksu (branch: ${{ github.event.inputs.SUSFS_BRANCH }})..."
          git clone --depth=1 \
            -b ${{ github.event.inputs.SUSFS_BRANCH }} \
            https://github.com/sidex15/susfs4ksu.git

          cd kernel_source

          # Copiar arquivos do SuSFS
          cp ../susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          cp ../susfs4ksu/kernel_patches/fs/sus_su.c fs/ 2>/dev/null || true

          # Aplicar patch no kernel
          echo "Aplicando patch do kernel..."
          PATCH=$(ls ../susfs4ksu/kernel_patches/ | grep "add_susfs_in_kernel-${{ env.KERNEL_VERSION }}" | head -1)
          if [ -n "$PATCH" ]; then
            patch -p1 --forward < ../susfs4ksu/kernel_patches/$PATCH && \
              echo "✅ Patch do kernel aplicado: $PATCH" || \
              echo "⚠️ Patch já aplicado ou conflito menor"
          else
            echo "❌ Patch não encontrado para kernel ${{ env.KERNEL_VERSION }}"
            ls ../susfs4ksu/kernel_patches/
            exit 1
          fi

          # Aplicar patch no KernelSU (em drivers/kernelsu)
          echo "Aplicando patch KernelSU..."
          # O RKSU usa drivers/kernelsu — adaptar patch manualmente se necessário
          KSU_PATCH=$(ls ../susfs4ksu/kernel_patches/KernelSU/ | head -1)
          if [ -n "$KSU_PATCH" ]; then
            patch -p1 --forward < ../susfs4ksu/kernel_patches/KernelSU/$KSU_PATCH && \
              echo "✅ Patch KSU aplicado" || \
              echo "⚠️ Patch KSU já aplicado ou conflito"
          fi

      # ── Configurar ────────────────────────────────────────────────
      - name: Gerar .config
        working-directory: kernel_source
        run: |
          export PATH=$HOME/clang/bin:$PATH
          make O=out ARCH=${{ env.ARCH }} ${{ github.event.inputs.DEFCONFIG }}

      - name: Ajustar configs KSU + SuSFS
        working-directory: kernel_source
        run: |
          # KSU (já tem default y, garantir ativo)
          ./scripts/config --file out/.config --enable CONFIG_KSU
          ./scripts/config --file out/.config --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE

          # SuSFS
          if [ "${{ github.event.inputs.ENABLE_SUSFS }}" == "true" ]; then
            ./scripts/config --file out/.config \
              --enable  CONFIG_KSU_SUSFS \
              --enable  CONFIG_KSU_SUSFS_SUS_PATH \
              --enable  CONFIG_KSU_SUSFS_SUS_MOUNT \
              --enable  CONFIG_KSU_SUSFS_SUS_KSTAT \
              --enable  CONFIG_KSU_SUSFS_TRY_UMOUNT \
              --enable  CONFIG_KSU_SUSFS_SPOOF_UNAME \
              --enable  CONFIG_KSU_SUSFS_ENABLE_LOG \
              --disable CONFIG_KSU_SUSFS_SUS_OVERLAYFS
          fi

          # LTO
          if [ "${{ github.event.inputs.ENABLE_LTO }}" == "true" ]; then
            ./scripts/config --file out/.config \
              --enable CONFIG_LTO_CLANG \
              --disable CONFIG_LTO_NONE
          fi

          # Aplicar novos configs
          make O=out ARCH=${{ env.ARCH }} olddefconfig

      # ── Compilar ──────────────────────────────────────────────────
      - name: Compilar kernel
        working-directory: kernel_source
        run: |
          export PATH=$HOME/clang/bin:$PATH

          BUILD_START=$(date +"%s")

          make -j$(nproc --all) O=out \
            ARCH=${{ env.ARCH }} \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            2>&1 | tee build.log

          BUILD_END=$(date +"%s")
          DIFF=$(( BUILD_END - BUILD_START ))
          echo "⏱️ Tempo de build: $(( DIFF / 60 )) min $(( DIFF % 60 )) seg"

          # Verificar se Image foi gerada
          if [ -f out/arch/arm64/boot/Image ]; then
            echo "✅ Image gerada com sucesso!"
            ls -lh out/arch/arm64/boot/Image*
          else
            echo "❌ Image não encontrada — build falhou"
            tail -50 build.log
            exit 1
          fi

      # ── AnyKernel3 ────────────────────────────────────────────────
      - name: Empacotar com AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

          # Copiar Image
          for img in Image Image.gz Image-dtb Image.gz-dtb; do
            if [ -f kernel_source/out/arch/arm64/boot/$img ]; then
              cp kernel_source/out/arch/arm64/boot/$img AnyKernel3/
              echo "✅ Copiado: $img"
              break
            fi
          done

          # Copiar DTB/DTBO se existirem
          [ -f kernel_source/out/arch/arm64/boot/dtbo.img ] && \
            cp kernel_source/out/arch/arm64/boot/dtbo.img AnyKernel3/ && \
            echo "✅ Copiado: dtbo.img"

          # Montar nome do zip
          SUSFS_TAG=""
          [ "${{ github.event.inputs.ENABLE_SUSFS }}" == "true" ] && SUSFS_TAG="-SuSFS"

          ZIP_NAME="${{ env.KERNEL_NAME }}-RKSU${SUSFS_TAG}-${{ env.DEVICE }}-$(date +%Y%m%d-%H%M).zip"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

          cd AnyKernel3
          zip -r9 ../$ZIP_NAME * -x .git README.md
          cd ..

          echo "📦 Pacote criado: $ZIP_NAME"
          ls -lh $ZIP_NAME

      # ── Upload artifacts ──────────────────────────────────────────
      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 7
          if-no-files-found: error

      - name: Upload build log (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure
          path: kernel_source/build.log
          retention-days: 3

      # ── Sumário ───────────────────────────────────────────────────
      - name: Resumo do build
        if: success()
        run: |
          echo "## ✅ Build concluído!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Kernel | ${{ env.KERNEL_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dispositivo | ${{ env.DEVICE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Defconfig | ${{ github.event.inputs.DEFCONFIG }} |" >> $GITHUB_STEP_SUMMARY
          echo "| RKSU | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| SuSFS | ${{ github.event.inputs.ENABLE_SUSFS }} |" >> $GITHUB_STEP_SUMMARY
          echo "| LTO | ${{ github.event.inputs.ENABLE_LTO }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Arquivo | \`${{ env.ZIP_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
